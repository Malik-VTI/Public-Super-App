version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: govapp_user
      POSTGRES_PASSWORD: govapp_password
      POSTGRES_DB: govapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
